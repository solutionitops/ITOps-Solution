  <!-- Brand intro preloader (see BRAND-LOADER.md). The 6s CSS animation hides it even if JS never runs. -->
  <style>
    #itops-preloader {
      position: fixed; inset: 0; z-index: 2147483647;
      display: grid; place-items: center;
      background: #0b0f19;
      transition: opacity .6s ease, visibility .6s;
      animation: itops-preloader-out .6s ease 6s forwards;
    }
    #itops-preloader.is-light { background: #f6f7fb; }
    #itops-preloader img { width: min(88vw, 760px); height: auto; aspect-ratio: 1578 / 512; visibility: hidden; }
    #itops-preloader img.is-ready { visibility: visible; }
    #itops-preloader.is-done { opacity: 0; visibility: hidden; }
    @keyframes itops-preloader-out { to { opacity: 0; visibility: hidden; } }
  </style>
</head>

<body>
  <div id="itops-preloader" aria-hidden="true"><img alt="" decoding="async" /></div>
  <script>
    // Plays on every full page load (never on in-app route changes); theme follows ThemeContext's
    // "itops-theme" key (default dark). Hides when BOTH the page has loaded AND the intro has played (3.6s) + 0.5s hold.
    (function () {
      var p = document.getElementById("itops-preloader"), img = p.firstElementChild, n = 0, dark = true;
      try { dark = localStorage.getItem("itops-theme") !== "light"; } catch (e) {}
      function done() { if (++n === 2) { p.classList.add("is-done"); setTimeout(function () { p.remove(); }, 700); } }
      img.onload = function () { img.className = "is-ready"; setTimeout(done, matchMedia("(prefers-reduced-motion: reduce)").matches ? 400 : 4100); };
      img.onerror = done; addEventListener("load", done);
      p.className = dark ? "" : "is-light"; img.src = dark ? "/itops-loader-dark.svg" : "/itops-loader.svg";
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
