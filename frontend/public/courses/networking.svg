<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glowNet">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgNet)" />

  {/* Network Topology Nodes & Connections */}
  <g stroke="#3b82f6" stroke-width="2" opacity="0.4" stroke-dasharray="6 6">
    <line x1="150" y1="120" x2="400" y2="225" />
    <line x1="650" y1="120" x2="400" y2="225" />
    <line x1="150" y1="330" x2="400" y2="225" />
    <line x1="650" y1="330" x2="400" y2="225" />
    <line x1="150" y1="120" x2="150" y2="330" />
    <line x1="650" y1="120" x2="650" y2="330" />
  </g>

  {/* Central Fiber Optic Switch / Router */}
  <g transform="translate(240, 150)">
    <rect width="320" height="150" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="3" filter="url(#glowNet)" />
    
    {/* Router Front Panel Ports */}
    <rect x="25" y="40" width="270" height="45" rx="6" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="50" cy="62" r="7" fill="#22c55e" />
    <circle cx="80" cy="62" r="7" fill="#22c55e" />
    <circle cx="110" cy="62" r="7" fill="#3b82f6" />
    <circle cx="140" cy="62" r="7" fill="#3b82f6" />
    <circle cx="170" cy="62" r="7" fill="#60a5fa" />
    <circle cx="200" cy="62" r="7" fill="#60a5fa" />
    <circle cx="230" cy="62" r="7" fill="#22c55e" />
    <circle cx="260" cy="62" r="7" fill="#ef4444" />

    {/* IP Address & Network Telemetry HUD */}
    <text x="160" y="115" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="14" font-weight="bold">GATEWAY: 192.168.1.1/24 (SUBNET MASK 255.255.255.0)</text>
  </g>

  {/* Outer Node Spheres */}
  <g filter="url(#glowNet)">
    <circle cx="150" cy="120" r="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5" />
    <text x="150" y="125" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">DNS</text>

    <circle cx="650" cy="120" r="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5" />
    <text x="650" y="125" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">HTTP</text>

    <circle cx="150" cy="330" r="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5" />
    <text x="150" y="335" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">TCP</text>

    <circle cx="650" cy="330" r="28" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2.5" />
    <text x="650" y="335" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">UDP</text>
  </g>
</svg>
