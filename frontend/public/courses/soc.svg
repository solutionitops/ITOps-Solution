<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="glowSoc">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgSoc)" />

  {/* SOC Radar Scope */}
  <g transform="translate(400, 210)" filter="url(#glowSoc)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#3b82f6" stroke-width="2.5" />
    <circle cx="0" cy="0" r="40" fill="#1e3a8a" fill-opacity="0.5" stroke="#60a5fa" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#60a5fa" />

    <line x1="0" y1="-150" x2="0" y2="150" stroke="#60a5fa" stroke-width="1.5" opacity="0.7" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#60a5fa" stroke-width="1.5" opacity="0.7" />

    {/* Radar Laser Sweep */}
    <polygon points="0,0 120,-70 140,-20" fill="#3b82f6" fill-opacity="0.35" />

    {/* Detected Threat Markers */}
    <circle cx="55" cy="-45" r="7" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="70" y="-42" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">ALERT [CRITICAL]</text>

    <circle cx="-60" cy="50" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <text x="-135" y="54" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">LOG: ANOMALY</text>
  </g>

  {/* HUD Header Banner */}
  <rect x="240" y="370" width="320" height="40" rx="20" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
  <text x="400" y="395" text-anchor="middle" fill="#60a5fa" font-family="monospace" font-size="13" font-weight="bold">SOC THREAT DETECTION &amp; INCIDENT RESPONSE</text>
</svg>
