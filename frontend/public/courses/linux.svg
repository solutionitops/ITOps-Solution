<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#374151" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Background */}
  <rect width="800" height="450" fill="url(#bg)" />

  {/* Circuit Grid Background Lines */}
  <g stroke="#374151" stroke-width="1" stroke-dasharray="6 6" opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  {/* Ambient Amber & Cyan Glow Orbs */}
  <circle cx="200" cy="150" r="140" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />
  <circle cx="600" cy="300" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />

  {/* 3D Linux Terminal Window */}
  <g transform="translate(140, 65)">
    <rect width="520" height="320" rx="12" fill="#030712" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow)" />
    <rect width="520" height="36" rx="12" fill="url(#termHeader)" />
    
    {/* Window Controls */}
    <circle cx="24" cy="18" r="6" fill="#ef4444" />
    <circle cx="44" cy="18" r="6" fill="#f59e0b" />
    <circle cx="64" cy="18" r="6" fill="#10b981" />
    <text x="260" y="23" text-anchor="middle" fill="#9ca3af" font-family="monospace" font-size="13" font-weight="bold">bash - user@itops-server:~</text>

    {/* Terminal Command Output Lines */}
    <text x="25" y="75" fill="#10b981" font-family="monospace" font-size="15" font-weight="bold">root@itops-server:~# systemctl status nginx.service</text>
    <text x="25" y="105" fill="#e5e7eb" font-family="monospace" font-size="14">● nginx.service - High Performance HTTP Server</text>
    <text x="25" y="130" fill="#10b981" font-family="monospace" font-size="14">   Loaded: loaded (/lib/systemd/system/nginx.service; enabled)</text>
    <text x="25" y="155" fill="#10b981" font-family="monospace" font-size="14">   Active: active (running) since Mon 2026-08-10 10:00:00 UTC</text>
    <text x="25" y="180" fill="#38bdf8" font-family="monospace" font-size="14">   Tasks: 4 (limit: 4915)</text>
    <text x="25" y="205" fill="#38bdf8" font-family="monospace" font-size="14">   Memory: 14.2M (code: 4.1M, data: 10.1M)</text>

    <text x="25" y="245" fill="#10b981" font-family="monospace" font-size="15" font-weight="bold">root@itops-server:~# chmod 755 /var/www/html/index.sh</text>
    <text x="25" y="275" fill="#f59e0b" font-family="monospace" font-size="15" font-weight="bold">root@itops-server:~# ./index.sh█</text>
  </g>

  {/* Tux Linux Badge Emblem */}
  <g transform="translate(640, 310)">
    <circle cx="40" cy="40" r="35" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="2" />
    <path d="M40 18 C30 18, 25 28, 25 40 C25 55, 30 62, 40 62 C50 62, 55 55, 55 40 C55 28, 50 18, 40 18 Z" fill="#ffffff" />
    <ellipse cx="40" cy="45" rx="10" ry="12" fill="#000000" />
    <circle cx="35" cy="30" r="2.5" fill="#000000" />
    <circle cx="45" cy="30" r="2.5" fill="#000000" />
    <polygon points="40,34 35,38 45,38" fill="#f59e0b" />
  </g>
</svg>
