<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="dockBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glowDock">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgDock)" />

  {/* 3D Stacked Container Grid */}
  <g transform="translate(180, 100)" filter="url(#glowDock)">
    {/* Row 1 Containers */}
    <rect x="50" y="140" width="100" height="70" rx="8" fill="url(#dockBlue)" stroke="#e0f2fe" stroke-width="2" />
    <text x="100" y="180" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">APP-NODE</text>

    <rect x="170" y="140" width="100" height="70" rx="8" fill="url(#dockBlue)" stroke="#e0f2fe" stroke-width="2" />
    <text x="220" y="180" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">REDIS-CACHE</text>

    <rect x="290" y="140" width="100" height="70" rx="8" fill="url(#dockBlue)" stroke="#e0f2fe" stroke-width="2" />
    <text x="340" y="180" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">POSTGRES</text>

    {/* Row 2 Containers */}
    <rect x="110" y="55" width="100" height="70" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="95" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">NGINX-PROXY</text>

    <rect x="230" y="55" width="100" height="70" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <text x="280" y="95" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">API-GATEWAY</text>
  </g>

  {/* Container Vessel Hull */}
  <g transform="translate(140, 310)">
    <path d="M 40 0 C 140 45, 380 45, 480 0 L 440 60 H 80 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3.5" filter="url(#glowDock)" />
    <text x="260" y="40" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">DOCKER ENGINE CONTAINER HOST</text>
  </g>
</svg>
