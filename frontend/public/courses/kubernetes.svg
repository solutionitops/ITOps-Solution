<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgK8s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="purpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <filter id="glowK8s">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgK8s)" />

  {/* Kubernetes Hexagonal Wheel Control Plane */}
  <g transform="translate(400, 200)" filter="url(#glowK8s)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="url(#purpGrad)" stroke="#ffffff" stroke-width="3" opacity="0.85" />
    <circle cx="0" cy="0" r="35" fill="#3b82f6" stroke="#ffffff" stroke-width="3" />
    
    {/* Spoke Lines */}
    <line x1="0" y1="-120" x2="0" y2="-35" stroke="#ffffff" stroke-width="3" />
    <line x1="104" y1="-60" x2="30" y2="-17" stroke="#ffffff" stroke-width="3" />
    <line x1="104" y1="60" x2="30" y2="17" stroke="#ffffff" stroke-width="3" />
    <line x1="0" y1="120" x2="0" y2="35" stroke="#ffffff" stroke-width="3" />
    <line x1="-104" y1="60" x2="-30" y2="17" stroke="#ffffff" stroke-width="3" />
    <line x1="-104" y1="-60" x2="-30" y2="-17" stroke="#ffffff" stroke-width="3" />

    {/* Helm Spokes */}
    <circle cx="0" cy="-140" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="120" cy="-70" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="120" cy="70" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="0" cy="140" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="-120" cy="70" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />
    <circle cx="-120" cy="-70" r="12" fill="#3b82f6" stroke="#ffffff" stroke-width="2" />

    <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">K8S</text>
  </g>

  {/* Outer Pod Cluster Badges */}
  <g transform="translate(140, 200)">
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" filter="url(#glowK8s)" />
    <text x="0" y="-5" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">POD-READY</text>
    <text x="0" y="15" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="11">[1/1 RUNNING]</text>
  </g>

  <g transform="translate(660, 200)">
    <rect x="-60" y="-30" width="120" height="60" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" filter="url(#glowK8s)" />
    <text x="0" y="-5" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">CLUSTER-NODE</text>
    <text x="0" y="15" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">[HEALTHY]</text>
  </g>
</svg>
