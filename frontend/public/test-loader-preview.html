<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITOps Solution Loader Verification</title>
  <style>
    body {
      background: #07090e;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 24px; color: #38bdf8; }
    .card {
      background: #0b0f19;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 30px;
      width: min(920px, 92vw);
      box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
    }
    .card h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-top: 0; }
    .preview-box { width: 100%; height: auto; }
    .btn-replay {
      background: #0284c7;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 12px;
      transition: background 0.2s;
    }
    .btn-replay:hover { background: #0369a1; }
  </style>
</head>
<body>
  <h1>ITOps Solution — Loader &amp; Static Logo Verification</h1>
  
  <button class="btn-replay" onclick="reloadLoader()">Replay Animation</button>

  <div class="card">
    <h2>1. Production Animated SVG Loader (itops-loader.svg)</h2>
    <div id="loader-container" class="preview-box">
      <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 165 1566 510" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="ITOps Solution">
  <title>ITOps Solution</title>
  <defs>

    <linearGradient id="server-center-grad" x1="0%" y1="0%" x2="0%" y2="100%">

  <style>
    :root {
      --loader-duration: 3.4s;
    }

    /* Transform origins for organic mechanical build-up */
    #server-left {
      transform-origin: 382px 490px;
      animation: serverBuildUp calc(var(--loader-duration) * 0.15) cubic-bezier(0.16, 1, 0.3, 1) calc(var(--loader-duration) * 0.05) both;
    }
    #server-center {
      transform-origin: 481px 490px;
      animation: serverBuildUp calc(var(--loader-duration) * 0.15) cubic-bezier(0.16, 1, 0.3, 1) calc(var(--loader-duration) * 0.10) both;
    }
    #server-right {
      transform-origin: 576px 490px;
      animation: serverBuildUp calc(var(--loader-duration) * 0.15) cubic-bezier(0.16, 1, 0.3, 1) calc(var(--loader-duration) * 0.15) both;
    }

    #server-left-lights {
      animation: lightsOn calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.20) both;
    }
    #server-center-lights {
      animation: lightsOn calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.25) both;
    }
    #server-right-lights {
      animation: lightsOn calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.30) both;
    }

    #cloud-stroke {
      stroke-dasharray: 2600;
      stroke-dashoffset: 2600;
      animation: cloudDraw calc(var(--loader-duration) * 0.24) cubic-bezier(0.4, 0, 0.2, 1) calc(var(--loader-duration) * 0.28) forwards;
    }
    #cloud-fill {
      animation: fadeIn calc(var(--loader-duration) * 0.15) ease-out calc(var(--loader-duration) * 0.42) both;
    }

    #shield {
      transform-origin: 481px 550px;
      animation: shieldDrop calc(var(--loader-duration) * 0.14) cubic-bezier(0.16, 1, 0.3, 1) calc(var(--loader-duration) * 0.52) both;
    }

    #lock-body {
      transform-origin: 481px 550px;
      animation: scaleFadeIn calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.61) both;
    }
    #lock-shackle {
      transform-origin: 481px 525px;
      animation: shackleLatch calc(var(--loader-duration) * 0.08) cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--loader-duration) * 0.66) both;
    }

    #wordmark-itops {
      animation: itopsReveal calc(var(--loader-duration) * 0.14) cubic-bezier(0.16, 1, 0.3, 1) calc(var(--loader-duration) * 0.70) both;
    }
    #wordmark-solution {
      animation: solutionFade calc(var(--loader-duration) * 0.12) ease-out calc(var(--loader-duration) * 0.78) both;
    }

    #tagline-line-left {
      transform-origin: 715px 618px;
      animation: lineExtend calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.84) both;
    }
    #tagline-line-right {
      transform-origin: 1638px 618px;
      animation: lineExtend calc(var(--loader-duration) * 0.08) ease-out calc(var(--loader-duration) * 0.84) both;
    }

    #tagline-secure {
      animation: fadeIn calc(var(--loader-duration) * 0.06) ease-out calc(var(--loader-duration) * 0.86) both;
    }
    #tagline-monitor {
      animation: fadeIn calc(var(--loader-duration) * 0.06) ease-out calc(var(--loader-duration) * 0.90) both;
    }
    #tagline-automate {
      animation: fadeIn calc(var(--loader-duration) * 0.06) ease-out calc(var(--loader-duration) * 0.94) both;
    }
    #tagline-scale {
      animation: fadeIn calc(var(--loader-duration) * 0.06) ease-out calc(var(--loader-duration) * 0.97) both;
    }

    /* Keyframes */
    @keyframes serverBuildUp {
      0% { opacity: 0; transform: scaleY(0.08); }
      50% { opacity: 0.9; }
      100% { opacity: 1; transform: scaleY(1); }
    }
    @keyframes lightsOn {
      0% { opacity: 0; filter: drop-shadow(0 0 0 transparent); }
      50% { opacity: 0.4; }
      100% { opacity: 1; filter: drop-shadow(0 0 5px #00e5ff); }
    }
    @keyframes cloudDraw {
      0% { stroke-dashoffset: 2600; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes scaleFadeIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shieldDrop {
      0% { opacity: 0; transform: translateY(-45px) scale(0.95); }
      80% { opacity: 1; transform: translateY(2px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shackleLatch {
      0% { opacity: 0; transform: translateY(-12px); }
      50% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes itopsReveal {
      0% { clip-path: inset(0 100% 0 0); opacity: 0; }
      10% { opacity: 1; }
      100% { clip-path: inset(0 0% 0 0); opacity: 1; }
    }
    @keyframes solutionFade {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes lineExtend {
      0% { opacity: 0; transform: scaleX(0); }
      100% { opacity: 1; transform: scaleX(1); }
    }

    /* Accessibility: Instant display for users with reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
        clip-path: none !important;
      }
    }
  </style>
