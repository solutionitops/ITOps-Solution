# Eclipse Mosquitto MQTT Broker Configuration for MOONSAV Lab
listener 1883 0.0.0.0
allow_anonymous true

# Websockets listener for browser UI telemetry stream
listener 9001 0.0.0.0
protocol websockets

# Persistence & logging
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
